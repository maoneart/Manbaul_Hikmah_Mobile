name: flutter_manbaul_hikmah
description: "Aplikasi Presensi QR, Tabungan Siswa, dan Pengumuman Sekolah Manbaul Hikmah"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  csv: ^6.0.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
