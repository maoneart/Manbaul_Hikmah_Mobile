name: Build Manbaul Hikmah APK & Web

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files & Dependencies
        run: |
          cd flutter_manbaul_hikmah
          flutter create --platforms=android,web .
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter_manbaul_hikmah
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manbaul-Hikmah-Release-APK
          path: flutter_manbaul_hikmah/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Web Files & Build
        run: |
          cd flutter_manbaul_hikmah
          flutter create --platforms=web .
          flutter pub get
          flutter build web --base-href "/Manbaul_Hikmah_Mobile/" --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manbaul-Hikmah-Web
          path: flutter_manbaul_hikmah/build/web
          retention-days: 30
