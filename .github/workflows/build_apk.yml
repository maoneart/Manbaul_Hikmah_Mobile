name: Build Manbaul Hikmah Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files & Dependencies
        run: |
          cd flutter_manbaul_hikmah
          flutter create --platforms=android .
          flutter pub get
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build Android Release APK
        run: |
          cd flutter_manbaul_hikmah
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Manbaul_Hikmah_Mobile.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manbaul-Hikmah-Release-APK
          path: flutter_manbaul_hikmah/build/app/outputs/flutter-apk/Manbaul_Hikmah_Mobile.apk
          retention-days: 30

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: 'SDIT Manbaul Hikmah Mobile v1.0.0 (Release APK)'
          body: |
            Release resmi SDIT Manbaul Hikmah Mobile: Aplikasi Presensi QR Siswa, Tabungan Digital Siswa, Manajemen Rombel & SPP SDIT Manbaul Hikmah.
            Terhubung langsung ke Shared Hosting REST API & MariaDB.
          files: flutter_manbaul_hikmah/build/app/outputs/flutter-apk/Manbaul_Hikmah_Mobile.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
